  if(!found) return alert("Wrong ID/password. Try ADMIN / 1234, MGR001 / MGR001, or employee ID as password.");
  currentUser = found;
  renderApp();
}

function logout(){ currentUser = null; renderLogin(); }

function visibleRows(){
  const q = (el("search")?.value || "").toLowerCase();
  let rows = [];
  if(currentUser.role === "hr") rows = allUsers().filter(u => u.role !== "hr");
  else if(currentUser.role === "manager") rows = allUsers().filter(u => u.manager === currentUser.name || u.id === currentUser.id);
  else rows = allUsers().filter(u => u.id === currentUser.id);
  return rows.filter(u => `${u.id} ${u.name} ${u.manager} ${u.designation}`.toLowerCase().includes(q));
}

function createLogin(){
  if(currentUser.role !== "hr") return alert("Only HR can create ID/password.");
  const obj = {
    id: el("newId").value.trim(),
    password: el("newPass").value.trim(),
    name: el("newName").value.trim(),
    role: el("newRole").value,
    manager: el("newManager").value.trim() || "HR Admin",
    designation: el("newDesignation").value.trim() || "Employee",
    salary: Number(el("newSalary").value || 0),
    department:"EASYSELL", status:"Live", present:0, leave:0, wo:0, hd:0, absent:0, deduction:0
  };
  if(!obj.id || !obj.password || !obj.name) return alert("Name, ID and password required.");
  created.push(obj);
  alert("Login created successfully. New user can login now.");
  renderApp();
}

function tableRows(){
  const rows = visibleRows();
  return rows.map(u => `<tr>
    <td><b class="yellow">${u.id} / ${u.password}</b></td>
    <td>${u.name||""}</td>
    <td><span class="pill">${u.role||"employee"}</span></td>
    <td>${u.designation||""}</td>
    <td>${u.manager||""}</td>
    <td>${u.present ?? "-"}</td>
    <td>${u.leave ?? "-"}</td>
    <td>${u.wo ?? "-"}</td>
    <td>${u.hd ?? "-"}</td>
    <td>${u.absent ?? "-"}</td>
    <td>${money(u.salary)}</td>
  </tr>`).join("");
}

function refreshTable(){
  const rows = visibleRows();
  const emp = rows.filter(u => u.role === "employee");
  el("visibleCount").innerText = rows.length;
  el("presentCount").innerText = emp.reduce((s,u)=>s+(u.present||0),0);
  el("leaveCount").innerText = emp.reduce((s,u)=>s+(u.leave||0),0);
  el("absentCount").innerText = emp.reduce((s,u)=>s+(u.absent||0),0);
  el("salaryCount").innerText = money(emp.reduce((s,u)=>s+(Number(u.salary)||0),0));
  el("tbody").innerHTML = tableRows();
}

function renderLogin(){
  document.body.innerHTML = `<div class="login"><div class="card">
    <div style="text-align:center;margin-bottom:25px"><div style="width:70px;height:70px;border-radius:20px;background:#facc15;color:#000;display:grid;place-items:center;margin:0 auto 14px;font-size:28px;font-weight:900">HR</div>
    <h1>MFINS / EASYSELL HRMS</h1><p style="color:#cbd5e1">HR creates all employee and manager IDs</p></div>
    <label>Employee ID</label><input id="id" value="ADMIN" style="margin:8px 0 14px">
    <label>Password</label><input id="pass" type="password" value="1234" style="margin:8px 0 18px">
    <button class="primary" onclick="login()" style="width:100%">Login</button>
    <div style="color:#cbd5e1;font-size:13px;margin-top:18px;line-height:1.7">
      HR Admin: <b>ADMIN / 1234</b><br>Manager example: <b>MGR001 / MGR001</b><br>Employee example: <b>${SAMPLE_EMP} / ${SAMPLE_EMP}</b><br>
      <span class="yellow">ID create option only HR ke pass hai.</span>
    </div>
  </div></div>`;
}

function renderApp(){
  document.body.innerHTML = `<div class="app">
  <aside><h2 class="yellow">EASYSELL HRMS</h2><p style="color:#94a3b8">Master Attendance Portal</p>
  <div class="nav"><a class="active">Dashboard</a><a>Monthly Attendance</a><a>Leave / PL</a><a>Late / Absent</a>${currentUser.role==="hr" ? "<a>Create ID & Password</a>" : ""}</div>
  <button class="ghost" onclick="logout()" style="position:absolute;bottom:24px;left:24px;right:24px">Logout</button></aside>
  <main><p class="yellow"><b>Welcome, ${currentUser.name}</b></p><h1>${currentUser.role==="hr" ? "MAIN HR ADMIN PORTAL" : currentUser.role==="manager" ? "MANAGER TEAM PORTAL" : "EMPLOYEE SELF PORTAL"}</h1>
  <p style="color:#94a3b8">${currentUser.role==="hr" ? "Full access: create ID/password, all employees, reports, salary and attendance." : currentUser.role==="manager" ? "Limited access: only assigned team." : "Limited access: only own attendance."}</p>
  <section class="grid stats">
    <div class="card stat"><p>Visible Users</p><b id="visibleCount">0</b></div>
    <div class="card stat"><p>Present Days</p><b id="presentCount">0</b></div>
    <div class="card stat"><p>Leave / PL</p><b id="leaveCount">0</b></div>
    <div class="card stat"><p>Absent</p><b id="absentCount">0</b></div>
    <div class="card stat"><p>Salary Base</p><b id="salaryCount">₹0</b></div>
  </section>
  ${currentUser.role==="hr" ? `<section class="hrbox"><h2>➕ Create Employee / Manager ID</h2><p>Yeh option sirf HR/Admin ko dikhega. Manager aur employee login me hidden rahega.</p>
  <div class="grid formgrid"><input id="newName" placeholder="Full Name"><input id="newId" placeholder="Employee ID"><input id="newPass" placeholder="Password"><select id="newRole"><option value="employee">Employee</option><option value="manager">Manager</option></select><input id="newManager" placeholder="Manager / Team Leader"><input id="newSalary" placeholder="Salary"><input id="newDesignation" placeholder="Designation"><button onclick="createLogin()">Create Login</button></div></section>` : ""}
  <section class="card" style="padding:22px"><div class="toolbar"><div><h2>Master Attendance Sheet - May 2026</h2><p style="color:#94a3b8;margin:6px 0">HR rows excluded. Employee password same as Employee ID.</p></div><input id="search" oninput="refreshTable()" placeholder="Search name, ID, manager..." style="max-width:320px"></div>
  <div class="tablewrap"><table><thead><tr><th>ID / Password</th><th>Name</th><th>Role</th><th>Designation</th><th>Manager</th><th>P</th><th>L</th><th>WO</th><th>HD</th><th>A</th><th>Salary</th></tr></thead><tbody id="tbody"></tbody></table></div></section>
  </main></div>`;
  refreshTable();
}

renderLogin();
</script>
</body>
</html>
